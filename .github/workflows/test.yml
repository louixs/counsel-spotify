name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - 25.1
          - 25.2
          - 25.3
          - 26.1
          - 26.2
          - 26.3
          - snapshot
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
    - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # master
      with:
        version: ${{ matrix.emacs_version }}
    - name: Run tests
      run: emacs -Q -batch -l ert -L . -L test/ -l test/output-tests.el -l test/query-tests.el -l test/parsing-tests.el -f ert-run-tests-batch-and-exit
    - uses: leotaku/elisp-check@b8228894697c3cf9989a0e63977de4a239160628 # master
      with:
        file: "counsel-spotify.el"
